<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cdeefc">
<title>焚き火から王国へ / CAMPFIRE TO KINGDOM</title>
<meta name="description" content="焚き火しか残っていない廃村を、木を切り岩を割って王国に育てる3Dの建国ゲーム。 / Grow a ruined village with only a campfire into a kingdom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels">
    <div id="tileLabel" class="tile-label" hidden></div>
    <div id="fullBubble" class="full-bubble" hidden></div>
  </div>
  <div id="vignette"></div>

  <header class="hud">
    <div class="hud-row">
      <div id="hpPill" class="pill hp"><img id="hpIco" class="ico" alt=""><div class="hpbar"><b id="hpFill"></b></div><span id="hpNum" class="num">10</span></div>
      <div id="bagPill" class="pill bag"><img id="bagIco" class="ico" alt=""><span id="bagNum" class="num">0/10</span></div>
      <span class="grow"></span>
      <button id="btnGear" class="hud-btn" type="button" aria-label="設定 / Settings">⚙</button>
    </div>
    <div id="mission" class="mission"><span id="missionText"></span></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </header>

  <div id="moveHint" class="move-hint"><i class="hand"></i><span></span></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <div id="fade"></div>
  <div id="fps" class="fps" hidden></div>

  <div id="settings" class="modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="setTitle">
      <h2 id="setTitle"></h2>
      <div class="set-row">
        <span id="lblSound"></span>
        <div class="seg">
          <button type="button" data-sound="1" id="sOn"></button>
          <button type="button" data-sound="0" id="sOff"></button>
        </div>
      </div>
      <div class="set-row">
        <span id="lblLang"></span>
        <div class="seg">
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">English</button>
        </div>
      </div>
      <p id="qInfo" class="q-info"></p>
      <div class="set-row col">
        <button type="button" id="btnReset" class="danger"></button>
        <div id="resetAsk" class="reset-ask" hidden>
          <p id="resetMsg"></p>
          <div class="seg">
            <button type="button" id="btnResetYes" class="danger"></button>
            <button type="button" id="btnResetNo"></button>
          </div>
        </div>
      </div>
      <button type="button" id="btnClose" class="close"></button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js?v=1"></script>
</body>
</html>
