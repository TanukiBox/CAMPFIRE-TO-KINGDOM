<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#cdeefc">
<title>焚き火から王国へ / CAMPFIRE TO KINGDOM</title>
<meta name="description" content="焚き火しか残っていない廃村を、木を切り岩を割って王国に育てる3Dの建国ゲーム。 / Grow a ruined village with only a campfire into a kingdom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>
  <div id="vignette"></div>

  <header class="hud">
    <div class="hud-row">
      <div id="hpPill" class="pill hp" hidden><img id="hpIco" class="ico" alt=""><div class="hpbar"><b id="hpFill"></b></div><span id="hpNum" class="num">10</span></div>
      <div id="bagPill" class="pill bag" hidden><img id="bagIco" class="ico" alt=""><span id="bagNum" class="num">0/10</span></div>
      <div id="coinPill" class="pill coin" hidden><img id="coinIco" class="ico" alt=""><span id="coinNum" class="num">0</span></div>
      <span class="grow"></span>
      <button id="btnGear" class="hud-btn" type="button" aria-label="設定 / Settings" hidden>⚙</button>
    </div>
    <div id="rankRow" class="rank-row" hidden>
      <span class="pill small"><img id="rankIco" class="ico" alt=""><span id="rankText"></span></span>
      <span class="pill small"><img id="popIco" class="ico" alt=""><span id="popNum" class="num">0</span></span>
    </div>
    <div id="mission" class="mission" hidden><span id="missionText"></span></div>
    <div id="bossBar" class="boss-bar" hidden><span id="bossName"></span><div class="bb"><b id="bossFill"></b></div></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </header>

  <div class="side-btns">
    <button id="btnUpgrade" class="big-btn" type="button" hidden><img id="upIco" alt=""><span id="upLbl"></span><i class="dot"></i></button>
    <button id="btnHire" class="big-btn" type="button" hidden><img id="hireIco" alt=""><span id="hireLbl"></span><i class="dot"></i></button>
  </div>

  <div id="moveHint" class="move-hint gone"><i class="hand"></i><span></span></div>
  <div id="joy" hidden><div id="joyKnob"></div></div>
  <div id="fade"></div>
  <div id="fps" class="fps" hidden></div>

  <div id="sheetModal" class="modal" hidden><div id="sheet" class="sheet"></div></div>

  <div id="title" class="modal title-screen" hidden>
    <div class="title-box">
      <div class="logo-fire" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1 id="titleLogo"></h1>
      <p id="titleSub" class="title-sub"></p>
      <button id="btnStart" type="button" class="start-btn"></button>
      <div id="debugBox" class="debug-box" hidden></div>
    </div>
  </div>

  <div id="settings" class="modal" hidden>
    <div class="sheet" role="dialog" aria-labelledby="setTitle">
      <h2 id="setTitle"></h2>
      <div class="set-row">
        <span id="lblSound"></span>
        <div class="seg">
          <button type="button" data-sound="1" id="sOn"></button>
          <button type="button" data-sound="0" id="sOff"></button>
        </div>
      </div>
      <div class="set-row">
        <span id="lblLang"></span>
        <div class="seg">
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="en">English</button>
        </div>
      </div>
      <p id="qInfo" class="q-info"></p>
      <button type="button" id="btnAway" hidden></button>
      <div class="set-row col">
        <button type="button" id="btnReset" class="danger"></button>
        <div id="resetAsk" class="reset-ask" hidden>
          <p id="resetMsg"></p>
          <div class="seg">
            <button type="button" id="btnResetYes" class="danger"></button>
            <button type="button" id="btnResetNo"></button>
          </div>
        </div>
      </div>
      <button type="button" id="btnClose" class="close"></button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js?v=2"></script>
</body>
</html>
